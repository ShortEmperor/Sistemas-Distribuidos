# 4 "computadoras" (contenedores) en la misma red, cada una con un proceso MPI.
# Levantar:  docker compose up -d --build
# Probar:    docker exec -it -u mpi mpi-matriz-nodo1 mpirun -np 4 --hostfile hosts ./matriz_mpi 1000 --verificar
#
# Solo nodo1 construye la imagen y los demas nodos usan esa misma imagen:
# la llave ssh se genera al construir, y todos los nodos necesitan la misma
# para entrar entre ellos sin contraseña.

name: mpi-matriz

x-nodo: &nodo
  image: mpi-matriz-nodo:latest
  shm_size: 1g
  networks: [mpi]

services:
  nodo1:
    <<: *nodo
    build: .
    pull_policy: build   # siempre se construye aqui, nunca se descarga
    hostname: nodo1
    container_name: mpi-matriz-nodo1
  nodo2:
    <<: *nodo
    hostname: nodo2
    container_name: mpi-matriz-nodo2
    depends_on: [nodo1]
    pull_policy: never   # la imagen la construye nodo1, no existe en Docker Hub
  nodo3:
    <<: *nodo
    hostname: nodo3
    container_name: mpi-matriz-nodo3
    depends_on: [nodo1]
    pull_policy: never   # la imagen la construye nodo1, no existe en Docker Hub
  nodo4:
    <<: *nodo
    hostname: nodo4
    container_name: mpi-matriz-nodo4
    depends_on: [nodo1]
    pull_policy: never   # la imagen la construye nodo1, no existe en Docker Hub

networks:
  mpi:
