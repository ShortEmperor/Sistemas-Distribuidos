# 2 "computadoras" (contenedores) en la misma red.
# Levantar:  docker compose up -d --build
# Probar:    docker exec -it -u mpi mpi-hola-nodo1 mpirun -np 2 --hostfile hosts.txt python3 hola_mpi.py
#
# Solo nodo1 construye la imagen y nodo2 usa esa misma imagen:
# la llave ssh se genera al construir, y los dos nodos necesitan la misma
# para entrar entre ellos sin contraseña.

name: mpi-holamundo

x-nodo: &nodo
  image: mpi-holamundo-nodo:latest
  shm_size: 256m
  networks: [mpi]

services:
  nodo1:
    <<: *nodo
    build: .
    pull_policy: build   # siempre se construye aqui, nunca se descarga
    hostname: nodo1
    container_name: mpi-hola-nodo1
  nodo2:
    <<: *nodo
    hostname: nodo2
    container_name: mpi-hola-nodo2
    depends_on: [nodo1]
    pull_policy: never   # la imagen la construye nodo1, no existe en Docker Hub

networks:
  mpi:
